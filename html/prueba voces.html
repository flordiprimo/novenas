<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Voces Disponibles</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .voice-info {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Prueba de Voces Disponibles</h1>
  <button id="cargarVoces">Cargar Voces</button>
  <div id="vocesContainer"></div>

  <script>
    function cargarVoces() {
      const vocesContainer = document.getElementById("vocesContainer");
      vocesContainer.innerHTML = ""; // Limpiar el contenedor

      const vocesDisponibles = window.speechSynthesis.getVoices();
      if (vocesDisponibles.length === 0) {
        vocesContainer.innerHTML = "<p>No se encontraron voces disponibles.</p>";
        return;
      }

      vocesDisponibles.forEach((voz, index) => {
        // Crear un contenedor para cada voz
        const voiceDiv = document.createElement("div");
        voiceDiv.classList.add("voice-info");
        voiceDiv.innerHTML = `<strong>Voz ${index + 1}</strong>`;

        // Agregar propiedades específicas con formato "voice.propiedad"
        voiceDiv.innerHTML += `<p><strong>voice.name:</strong> ${voz.name}</p>`;
        voiceDiv.innerHTML += `<p><strong>voice.lang:</strong> ${voz.lang}</p>`;
        voiceDiv.innerHTML += `<p><strong>voice.localService:</strong> ${voz.localService}</p>`;
        voiceDiv.innerHTML += `<p><strong>voice.default:</strong> ${voz.default}</p>`;

        // Añadir el contenedor de la voz al principal
        vocesContainer.appendChild(voiceDiv);
      });
    }

    // Asegurarse de que las voces estén cargadas
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = cargarVoces;
    }

    // Cargar las voces al hacer clic en el botón
    document.getElementById("cargarVoces").addEventListener("click", cargarVoces);
  </script>
</body>
</html>
